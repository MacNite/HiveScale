; BLE notification-throughput measurement client (issue #71, phase 0e).
;
; A standalone bench sketch, NOT part of the HiveHub firmware — it is a separate
; PlatformIO project so it can never be linked into a hub image by accident.
; Flash it to a SPARE ESP32; it connects to a HiveInside node running the
; throughput spike (HiveInside firmware-nrf54lm20a/throughput-spike.conf) and
; reports how fast notifications actually arrive.
;
; Why a real ESP32 rather than a laptop: the relay's controller is what the
; audio feature has to live with. The classic ESP32 is BLE 4.2 with no 2M PHY;
; the C6 has it. Both environments are here so the difference is measurable
; rather than assumed.
;
;   pio run -e esp32dev -t upload -t monitor
;   pio run -e xiao_esp32c6 -t upload -t monitor
;
; The pins below mirror firmware/platformio.ini's pinned platform and NimBLE
; version so the measurement runs on the same stack the hub does.

[env]
framework = arduino
monitor_speed = 115200
lib_deps = h2zero/NimBLE-Arduino@2.5.0
build_flags =
    -std=gnu++17
; Address of the HiveInside node to measure. Leave empty to scan for the first
; device whose name starts with TP_NAME_PREFIX.
    -DTP_TARGET_MAC='""'
    -DTP_NAME_PREFIX='"HiveInside"'
; Seconds to blast, notification payload in bytes (20-244), and the connection
; interval in 1.25 ms units (0 = leave whatever was negotiated; 12 = 15 ms).
    -DTP_DURATION_S=15
    -DTP_PAYLOAD=244
    -DTP_INTERVAL_UNITS=12
; Set to 1 and fill in the credentials below to repeat the measurement with WiFi
; actively downloading — the coexistence case a streaming design would live in.
    -DTP_WIFI_LOAD=0
    -DTP_WIFI_SSID='""'
    -DTP_WIFI_PASS='""'
    -DTP_LOAD_URL='"http://your-server.example/somefile.bin"'

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32dev

[env:xiao_esp32c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = seeed_xiao_esp32c6
